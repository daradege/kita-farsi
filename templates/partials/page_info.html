<div class="text-sm antialiased opacity-60">
  {% if page?.date %}
  <time>{{ <jalali_date date={page?.date} format="%d %B %Y" /> }}</time>
  <span class="mx-1">&middot;</span>
  <span>{{ <persianize text={page?.reading_time} /> }} دقیقه</span>
  {% endif %}<!---->
  {% if page?.authors | length > 0 %}<!---->
  {% set author = page?.authors | join(sep=", ") %}<!---->
  {% else %}<!---->
  {% set author = config.author %}<!---->
  {% endif %}<!---->
  {% if author %}
  <span class="mx-1">&middot;</span>
  <span>{{ author }}</span>
  {% endif %}
  <!-- Page Info inject -->
  {% include "injects/page_info.html" %}
</div>
